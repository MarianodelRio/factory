name: Release

# Push a tag vX.Y.Z (matching pyproject.toml, npm/package.json and CHANGELOG.md) to publish
# swfactory to PyPI, swfactory to npm, and a GitHub release. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: The tag matches every version
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import json, sys, tomllib
          version = sys.argv[1]
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "npm/package.json": json.load(open("npm/package.json"))["version"],
          }
          bad = {name: v for name, v in found.items() if v != version}
          if bad or f"## [{version}]" not in open("CHANGELOG.md").read():
              sys.exit(f"tag v{version} does not match: {bad or 'no CHANGELOG.md section'}")
          PY
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swfactory/
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: pypi  # the launcher runs the PyPI package of the same version
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/swfactory
    permissions:
      contents: read
      id-token: write  # npm trusted publishing, with provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest  # trusted publishing needs npm 11.5.1 or later
      - run: cp LICENSE npm/LICENSE
      - run: npm publish --access public
        working-directory: npm

  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
